# Weekly dependency updates. The cooldown skips versions younger than 14 days, so a broken or
# compromised release has time to be caught before it reaches this repo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
