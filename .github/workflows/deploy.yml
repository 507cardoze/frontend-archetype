name: Deploy

# Runs after the quality gate passes on a push to main, or by hand from main. Off until the
# repository variable DEPLOY_ENABLED is 'true' (see docs/deployment.md). It has to be a repository
# variable: environment variables do not exist yet when the job-level `if` is evaluated.
on:
  workflow_run:
    workflows: [Quality gate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: temporary AWS credentials, no access keys stored anywhere

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # `branches: [main]` above matches the head branch name, which a fork PR can also call main:
    # deploy only runs that came from a push to this repository.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Approvals and environment variables live in this GitHub environment.
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
          VITE_LOGIN_URL: ${{ vars.VITE_LOGIN_URL || '/api/auth/login' }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: pnpm deploy:s3
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
